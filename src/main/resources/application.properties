spring.application.name=myapp

# Logging
logging.level.org.springframework.security=DEBUG

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JWT
app.jwt.secret=pr1E7nxESk1e2Ds2gKQfuzY2X7jT9u5oyJSE5cS4Mf4=
app.jwt.issuer=myapp
app.jwt.access-token-ttl=10s

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
app.kafka.trip-events-topic=trip-events
app.kafka.publish-timeout=5s

app.fare.per-meter=30
app.fare.minimum=10000