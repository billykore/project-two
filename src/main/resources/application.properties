spring.application.name=myapp

# Secrets and machine-specific values come from environment variables or a local .env file
# (copy .env.example to .env). .env is git-ignored.
spring.config.import=optional:file:.env[.properties]

# Logging
logging.level.org.springframework.security=DEBUG

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.issuer=myapp
app.jwt.access-token-ttl=10s

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
app.kafka.trip-events-topic=trip-events
app.kafka.publish-timeout=5s

app.fare.per-meter=30
app.fare.minimum=10000

# Password reset. The secret keys the hash of one-time codes; generate with: openssl rand -base64 32
# log-codes makes the development sender write codes to the log; leave it false in production.
app.password-reset.code-ttl=5m
app.password-reset.max-attempts=5
app.password-reset.resend-interval=60s
app.password-reset.max-codes-per-hour=5
app.password-reset.lock-timeout=15s
app.password-reset.log-codes=${APP_PASSWORD_RESET_LOG_CODES:false}
app.password-reset.code-secret=${APP_RESET_CODE_SECRET}
