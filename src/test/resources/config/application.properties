# Test-only settings, so the test suite never depends on a developer's git-ignored .env.
# classpath:/config/application.properties takes precedence over the main application.properties.
# Database and Kafka connections come from Testcontainers (@ServiceConnection); these only satisfy placeholders.
DB_USERNAME=test
DB_PASSWORD=test
# Base64 of a fixed, non-secret test string (>= 32 bytes). Never use it outside tests.
APP_JWT_SECRET=dGVzdC1vbmx5LWhtYWMta2V5LW5ldmVyLXVzZS1pbi1wcm9kdWN0aW9u
# Base64 of a fixed, non-secret test string (>= 32 bytes). Never use it outside tests.
APP_RESET_CODE_SECRET=dGVzdC1vbmx5LXJlc2V0LWNvZGUta2V5LW5ldmVyLXVzZS1pbi1wcm9kdWN0aW9u
